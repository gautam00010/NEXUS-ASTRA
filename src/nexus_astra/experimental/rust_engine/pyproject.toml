[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "rust_engine"
version = "0.1.0"
description = "High-performance Rust extension module for NEXUS-ASTRA trading system"
requires-python = ">=3.10"
license = { text = "MIT" }
readme = "README.md"

[project.optional-dependencies]
dev = ["pytest", "pyarrow", "polars", "numpy"]

[tool.maturin]
# Build a Python extension module (not a standalone binary)
features = ["pyo3/extension-module"]
# Module name when imported in Python
module-name = "rust_engine"
# Build profile
profile = "release"
# Strip debug symbols for smaller .pyd / .so
strip = true

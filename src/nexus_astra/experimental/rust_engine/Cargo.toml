[package]
name = "rust_engine"
version = "0.1.0"
edition = "2021"
authors = ["NEXUS-ASTRA Team"]
description = "High-performance Rust extension module for the NEXUS-ASTRA trading system"
license = "MIT"

[lib]
name = "rust_engine"
crate-type = ["cdylib"]

[dependencies]
# PyO3 — Python ↔ Rust bridge (extension-module feature for maturin)
pyo3 = { version = "0.22", features = ["extension-module"] }

# Arrow interop — zero-copy DataFrame exchange with Python
arrow = { version = "53", features = ["ffi"] }

# Polars — fast columnar DataFrames in Rust
polars = { version = "0.44", features = ["lazy", "csv", "json", "dtype-struct"] }

# Rayon — data parallelism for Monte Carlo
rayon = "1.10"

# Random number generation
rand = "0.8"
rand_distr = "0.4"

# Serde for options chain parsing
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"

# Error handling
thiserror = "2"

[dev-dependencies]
# Criterion.rs — micro-benchmarks
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "bench_core"
harness = false
